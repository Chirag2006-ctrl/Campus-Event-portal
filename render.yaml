# Free academic demo. Render free PostgreSQL expires after 30 days.
databases:
  - name: campus-event-db
    plan: free
    databaseName: campus_events
    user: campus_events
services:
  - type: web
    name: campus-event-portal
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campus-event-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
